name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches CMake version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CMAKE_VER=$(sed -n 's/^project(screenplus-tray VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "Tag: ${TAG}, CMake version: v${CMAKE_VER}"
          if [ "${TAG}" != "v${CMAKE_VER}" ]; then
            echo "Error: tag ${TAG} does not match CMakeLists.txt version v${CMAKE_VER}" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libdbus-1-dev

      - name: Build and stage release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix stage
          strip stage/bin/screenplus-tray
          ./stage/bin/screenplus-tray --version

      - name: Verify dynamic libraries and GLIBC symbol versions
        run: |
          BIN="stage/bin/screenplus-tray"
          echo "=== ldd ${BIN} ==="
          ldd "${BIN}"

          echo "=== Direct NEEDED libraries ==="
          NEEDED=$(objdump -p "${BIN}" | awk '$1 == "NEEDED" { print $2 }')
          echo "${NEEDED}"
          for lib in ${NEEDED}; do
            case "${lib}" in
              libc.so.6|libm.so.6|libdbus-1.so.3|ld-linux-x86-64.so.2) ;;
              *)
                echo "Error: unexpected direct dependency: ${lib}" >&2
                exit 1
                ;;
            esac
          done

          echo "=== Highest GLIBC symbol version ==="
          MAX_GLIBC=$(objdump -T "${BIN}" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "Highest GLIBC required: ${MAX_GLIBC}"
          HIGHEST=$(printf '%s\n2.39\n' "${MAX_GLIBC}" | sort -V | tail -n 1)
          if [ "${HIGHEST}" != "2.39" ]; then
            echo "Error: binary requires GLIBC_${MAX_GLIBC} (> 2.39)" >&2
            exit 1
          fi

          echo "=== Verify relative icon path resolution under arbitrary prefix ==="
          mkdir -p /tmp/any-prefix
          cp -a stage/bin stage/share /tmp/any-prefix/
          test -f /tmp/any-prefix/share/screenplus-tray/icons/screenplus-tray.png
          /tmp/any-prefix/bin/screenplus-tray --version

      - name: Package tarball and checksums
        run: |
          tar -C stage -czf screenplus-tray-linux-x86_64.tar.gz bin share
          sha256sum screenplus-tray-linux-x86_64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            screenplus-tray-linux-x86_64.tar.gz \
            SHA256SUMS.txt \
            --title "ScreenPlusTray ${GITHUB_REF_NAME}" \
            --generate-notes
